# Every hour: analyse FPL and upload the bot's texts (captain, differentials,
# each Premium team) to the Cloudflare Worker. Needs the TELEGRAM_BOT_TOKEN secret.
name: FPL bot data

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency: fpl-bot-data

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upload analysis to the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: python -m stars_bot.publish
